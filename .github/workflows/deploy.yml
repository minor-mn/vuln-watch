name: Deploy production

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: vuln-watch-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'minor-mn/vuln-watch'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy as nacci
        env:
          DEPLOY_KEY: ${{ secrets.VULN_WATCH_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VULN_WATCH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_KEY:?Set the VULN_WATCH_DEPLOY_KEY repository secret}"
          : "${KNOWN_HOSTS:?Set the VULN_WATCH_KNOWN_HOSTS repository secret}"

          install -d -m 0700 "$HOME/.ssh"
          key_file="$RUNNER_TEMP/vuln-watch-deploy-key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 0600 "$key_file"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

          ssh \
            -i "$key_file" \
            -p 50022 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            nacci@an.umr.biz \
            deploy
