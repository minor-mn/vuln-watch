# Products to watch. Matching is case-insensitive.
#
#   name:    product name (also used for display)
#   vendors: vendor names as they appear in CVE `affected[].vendor`
#   aliases: other names as they appear in CVE `affected[].product` or descriptions
products:
  - name: Ruby on Rails
    vendors:
      - rails
    aliases:
      - rails
      - ruby on rails
      - actionpack
      - activerecord
      - activesupport

  - name: PostgreSQL
    vendors:
      - postgresql
      - postgresql global development group
      - the postgresql global development group
      - postgresql.org
    aliases:
      - postgres
      - postgresql server

  - name: OpenSearch
    vendors:
      - opensearch
      - opensearch-project
    aliases:
      - opensearch

  - name: Metabase
    vendors:
      - metabase
